name: Netease Daily Sign

on:
  schedule:
    - cron: "35 20 * * *"   # 每天 04:35 (UTC+8)
    - cron: "30 14 * * *"   # 每天 22:30 (UTC+8)
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run sign
        env:
          TZ: Asia/Shanghai
          NETEASE_COOKIE: ${{ secrets.NETEASE_COOKIE }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: node sign.js 2>&1 | tee sign.log

      - name: Push result to WeChat
        if: always()
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python3 pushplus_notify.py "网易云音乐每日签到" sign.log "${{ job.status }}"
